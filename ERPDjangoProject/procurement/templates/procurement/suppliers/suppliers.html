{% extends 'base.html' %}
{% block title %} Products {% endblock %}

{% block content %}
<h1>Provedores</h1>
    <table>
        <tr>
            <th>Nombre</th>
            <th>Email</th>
            <th>Telefono</th>
            <th>RUC</th>
            <th>Editar</th>
        </tr>
        <tbody>
        {% for supplier in suppliers %}
            <tr>
                <td><a href="{% url 'supplier_details' supplier_id=supplier.id %}">{{ supplier.name }} <i class="bi bi-eye"></i></a></td>
                <td>{{ supplier.email }}</td>
                <td>{{ supplier.phone }}</td>
                <td>{{ supplier.ruc }}</td>
                <td><a href="{% url 'update_supplier' supplier_id=supplier.id %}" class="btn btn-sm btn-warning">
                    Editar <i class="bi bi-pencil"></i>
                </a></td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
    <a href="{% url 'create_supplier' %}">agregar nuevo</a>

{% endblock %}
