{% extends 'base.html' %}
{% block title %} Products {% endblock %}

{% block content %}
<h1>Provedores</h1>
    <div class="table-responsive">
        <table class="table table-striped table-hover table-to-cards">
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>RUC</th>
                    <th>Email</th>
                    <th>Telefono</th>
                </tr>
            </thead>
            <tbody>
            {% for supplier in suppliers %}
                <tr>
                    <td data-label="Nombre"><a href="{% url 'supplier_details' supplier_id=supplier.id %}">{{ supplier.name }} <i class="bi bi-eye"></i></a></td>
                    <td data-label="RUC">{{ supplier.ruc }}</td>
                    <td data-label="Email">{{ supplier.email }}</td>
                    <td data-label="Telefono">{{ supplier.phone }}</td>
                </tr>
            {% endfor %}
            </tbody>
        </table>

    </div>
    <a href="{% url 'create_supplier' %}">agregar nuevo</a>

{% endblock %}
