{% extends 'procurement/_base.html' %}
{% block title %} Products {% endblock %}

{% block content %}
<h1>Provedores</h1>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Agregar</button>
</form>
    <table>
        <tr>
            <th>Nombre</th>
            <th>telefono</th>
            <th>email</th>
        </tr>
        <tbody>
        {% for supplier in suppliers %}
            <tr>
                <td>{{ supplier.name }}</td>
                <td>{{ supplier.phone }}</td>
                <td>{{ supplier.email }}</td>
            </tr>
        {% endfor %}

        </tbody>

    </table>

{% endblock %}
