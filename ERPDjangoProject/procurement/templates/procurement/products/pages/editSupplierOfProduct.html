{% extends 'base.html' %}
{% load static %}
{% block content %}
<form method="post">
    {% csrf_token %}
        <div id="detalles" class="card mb-4 mx-auto">
            <div class="card-header">
                <h3> Editar Datos del proveedor del producto</h3>
            </div>
            <div class="card-body">
                {%  for field in form %}
                    <div class="row mt-3">
                        <label for="{{ field.id_for_label }}" class="col-form-label col-xs-12 col-sm-3 col-md-3 col-lg-2 col-xl-2 col-xxl-2">
                            {{ field.label }}
                        </label>
                        <div class="col-xs-12 col-sm-9 col-md-9 col-lg-6 col-xl-6 col-xxl-6">
                            <div>{{ field }}</div>
                        </div>
                    </div>
                {% endfor %}
                <div class="mt-4 text-end p-3">
                    <button id="save-product" class="btn btn-success" type="submit">Guardar</button>
                    <a href="{% url 'product_details' product_id=form.instance.id %}?tab-name=suppliers" class="btn btn-danger">Cancelar</a>
                </div>
            </div>
        </div>
</form>
{% endblock %}
