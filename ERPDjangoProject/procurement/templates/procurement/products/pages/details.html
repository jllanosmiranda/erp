{% extends 'procurement/products/pages/base.html' %}
{% load static %}
{% block tabcontent %}

<div class="card mb-4 mx-auto">
    <div class="card-header">
        <h3>Informacion basica</h3>
    </div>
    <div class="card-body">
        <div class="basic-info">
            <div class="row mt-3">
                <div class="col-xs-12 col-sm-9 col-md-9 col-lg-6 col-xl-6 col-xxl-6">
                    <div class="view-input active"> Nombre </div>
                </div>
                <div class="col-xs-12 col-sm-9 col-md-9 col-lg-6 col-xl-6 col-xxl-6">
                    <div class="view-input active">{{ product.product_name }}</div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-xs-12 col-sm-9 col-md-9 col-lg-6 col-xl-6 col-xxl-6">
                    <div class="view-input active"> Codigo </div>
                </div>
                <div class="col-xs-12 col-sm-9 col-md-9 col-lg-6 col-xl-6 col-xxl-6">
                    <div class="view-input active">{{ object.code }}</div>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-xs-12 col-sm-9 col-md-9 col-lg-6 col-xl-6 col-xxl-6">
                    <div class="view-input active"> Descripcion </div>
                </div>
                <div class="col-xs-12 col-sm-9 col-md-9 col-lg-6 col-xl-6 col-xxl-6">
                    <div class="view-input active">{{ product.product_description }}</div>
                </div>
            </div>
        </div>
    </div>
    <div class="mt-4 text-end p-3">
        <a href="{% url 'product_edit_basic_information' product_id=product.id %}" class="btn btn-primary">Editar</a>
    </div>
</div>


{% endblock %}
{% block extra_js %}
    <script type=module src="{% static 'procurement/js/common/tabs.js' %}"></script>
{% endblock %}
