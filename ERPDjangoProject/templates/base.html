<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %} my site {% endblock %}</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" type="text/css" href="{% static 'css/styles.css' %}">
</head>
<body id="body" class="d-flex flex-column min-vh-100 bg-light">
    <!-- Mobile header with toggle button -->
    <header class="navbar navbar-dark bg-dark sticky-top d-md-none p-2">
        <!-- Modified hamburger button to ensure it works on mobile touch devices -->
        <button class="navbar-toggler d-md-none" type="button" id="sidebarToggle" aria-controls="sidebarMenu" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <span class="navbar-brand">ERP System</span>
    </header>

    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar menu - modified to ensure proper display on mobile -->
            <div class="col-md-3 col-lg-2 d-md-block sidebar" id="sidebarMenu">
                {% include 'navbar.html' %}
            </div>
            <div class="col-md-9 ms-sm-auto col-lg-10 px-md-4">
                <main class="py-3">
                    {% block content %} {% endblock %}
                </main>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        try {
          var tables = document.querySelectorAll('table');
          tables.forEach(function(tbl) {
            tbl.classList.add('table');
            tbl.classList.add('table-striped');
            tbl.classList.add('table-hover');
            tbl.classList.add('table-bordered');
            tbl.classList.add('table-sm');
          });
        } catch (e) {
          console && console.warn && console.warn('Table enhancement script error:', e);
        }
      });
    </script>
    <script src="{% static 'js/navbar.js' %}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
